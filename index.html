<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Астро Сумісність</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f7f9fc; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 90%; width: 350px; }
        h1 { color: #5a67d8; font-size: 24px; margin-bottom: 20px; }
        select { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 16px; background: #f8fafc; }
        button { background: #5a67d8; color: white; border: none; padding: 15px 20px; border-radius: 10px; font-size: 18px; width: 100%; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background: #434ce6; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #2d3748; min-height: 100px; text-align: left; line-height: 1.5; }
        .percentage { display: block; text-align: center; font-size: 24px; color: #5a67d8; margin-bottom: 10px; }
        .description { font-size: 15px; font-weight: normal; color: #4a5568; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Перевірка Сумісності ✨</h1>
        <select id="sign1">
            <option value="">Обери свій знак...</option>
            <option value="Овен">♈ Овен</option>
            <option value="Телець">♉ Телець</option>
            <option value="Близнюки">♊ Близнюки</option>
            <option value="Рак">♋ Рак</option>
            <option value="Лев">♌ Лев</option>
            <option value="Діва">♍ Діва</option>
            <option value="Терези">♎ Терези</option>
            <option value="Скорпіон">♏ Скорпіон</option>
            <option value="Стрілець">♐ Стрілець</option>
            <option value="Козеріг">♑ Козеріг</option>
            <option value="Водолій">♒ Водолій</option>
            <option value="Риби">♓ Риби</option>
        </select>
        <select id="sign2">
            <option value="">Обери знак партнера...</option>
            <option value="Овен">♈ Овен</option>
            <option value="Телець">♉ Телець</option>
            <option value="Близнюки">♊ Близнюки</option>
            <option value="Рак">♋ Рак</option>
            <option value="Лев">♌ Лев</option>
            <option value="Діва">♍ Діва</option>
            <option value="Терези">♎ Терези</option>
            <option value="Скорпіон">♏ Скорпіон</option>
            <option value="Стрілець">♐ Стрілець</option>
            <option value="Козеріг">♑ Козеріг</option>
            <option value="Водолій">♒ Водолій</option>
            <option value="Риби">♓ Риби</option>
        </select>
        <button onclick="calculateCompatibility()">Дізнатися сумісність</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateCompatibility() {
            const sign1 = document.getElementById('sign1').value;
            const sign2 = document.getElementById('sign2').value;
            const resultDiv = document.getElementById('result');
            
            if (!sign1 || !sign2) {
                resultDiv.innerHTML = "<div style='text-align:center; color:#e53e3e;'>Будь ласка, обери обидва знаки!</div>";
                return;
            }

            resultDiv.innerHTML = "<div style='text-align:center; color:#a0aec0;'>⏳ Аналізуємо енергії...</div>";

            setTimeout(() => {
                const percentage = Math.floor(Math.random() * (99 - 60 + 1)) + 60;
                
                // Детальні описи для різних типів сумісності
                const texts = [
                    "Це кармічна зустріч, де важливу роль відіграє Сатурн. Стосунки можуть вимагати терпіння, відповідальності та серйозної роботи над собою. Якщо ви пройдете ці спільні уроки, ваш союз стане міцним фундаментом на роки.",
                    "Чудова синергія! Ваші енергії дуже гармонійно переплітаються. Вплив Юпітера розширює горизонти цієї пари, даруючи оптимізм, щедрість та глибоке взаєморозуміння. Ви здатні надихати одне одного на великі звершення.",
                    "Дуже цікавий союз, сповнений яскравих емоцій. Енергія Марса дає цій парі багато пристрасті та потужний драйв для спільного розвитку. Головне завдання — вчитися знаходити компроміси, щоб цей вогонь зігрівав, а не створював конфлікти.",
                    "Неординарна та яскрава взаємодія! Енергія Урана приносить у ваші стосунки багато сюрпризів, оновлень та прагнення до свободи. З вами ніколи не буває нудно, але для тривалої стабільності потрібен дуже високий рівень довіри."
                ];
                
                const randomText = texts[Math.floor(Math.random() * texts.length)];
                
                resultDiv.innerHTML = `
                    <span class="percentage">Сумісність: ${percentage}%</span>
                    <span class="description">${randomText}</span>
                `;
            }, 800);
        }
    </script>
</body>
</html>
